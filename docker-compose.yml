# The full two-service stack. This is what runs in production too.
#   api    — FastAPI ingest + business logic, Gemini parsing, Excel export
#   bridge — Baileys transport; the bot's only link to WhatsApp
#
# Neither port is published beyond 127.0.0.1. Nothing needs to reach this host
# from outside: the bridge holds an outbound WebSocket to WhatsApp, and the API
# is only ever called by the bridge over the compose network.
#
# Usage:
#   1. Create .env (API) and baileys-bridge/.env (bridge) from their examples.
#   2. On the compose network the two reach each other by service name, so set:
#        in .env                  BAILEYS_BRIDGE_URL=http://bridge:8088
#        in baileys-bridge/.env   PYTHON_INGEST_URL=http://api:8000/baileys/incoming
#      and use the SAME BRIDGE_SHARED_SECRET in both.
#   3. Set ALLOWED_GROUP_IDS in baileys-bridge/.env — the bridge refuses to
#      start unfiltered. The first boot logs every group's JID.
#   4. docker compose up -d --build
#   5. Watch `docker compose logs -f bridge` once to link the device.

services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  bridge:
    build: ./baileys-bridge
    env_file: baileys-bridge/.env
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - api
    volumes:
      # Persist the linked-device session so you only link once. Losing this
      # means re-pairing with the physical phone.
      - baileys_auth:/app/auth_info
    # /health reports the WhatsApp socket, not just the HTTP server. This does
    # not restart anything on its own — the bridge exits non-zero on logout and
    # `restart: unless-stopped` handles that — but it surfaces a socket that
    # died some other way as unhealthy. Uses node rather than curl/wget:
    # neither is in node:20-slim.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # HTTPS for the web dashboard — the one service reachable from outside.
  # Behind a profile so a plain `docker compose up` (and `up -d --build api`)
  # leaves it alone. Set DASHBOARD_DOMAIN in .env (compose reads that file for
  # substitution; the api ignores the key), then start it once with:
  #   docker compose --profile public up -d caddy
  # Needs ports 80 and 443 open in the VPC firewall. The default, localhost,
  # only keeps compose from failing where the domain is not set.
  caddy:
    image: caddy:2.8.4
    profiles: ["public"]
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its account key; losing them only means Caddy
      # requests a new certificate.
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  baileys_auth:
  caddy_data:
