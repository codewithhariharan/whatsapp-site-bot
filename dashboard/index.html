<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc; --border: #e3e8ef;
  --text: #0f1b2d; --muted: #5b6b80; --faint: #8a98aa;
  --brand: #1f3a5f; --brand-2: #2f6fb3; --accent: #e8f1fb;
  --good: #1f8a5b; --warn: #b7791f; --bad: #c0392b; --bad-bg: #fdecea;
  --shadow: 0 1px 2px rgba(16,27,45,.06), 0 1px 3px rgba(16,27,45,.08);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1520; --surface: #142131; --surface-2: #192a3e; --border: #24384f;
    --text: #e6edf5; --muted: #9db0c6; --faint: #6f849c;
    --brand: #8fb8e8; --brand-2: #5d9ee0; --accent: #1b3350;
    --good: #4cc38a; --warn: #e0a64a; --bad: #ef6b5b; --bad-bg: #3a1d1d;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-2); }

header.top {
  background: var(--brand); color: #fff; padding: 14px 24px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
@media (prefers-color-scheme: dark) { header.top { background: #10233a; } }
header.top h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
header.top .sub { opacity: .75; font-size: 13px; }
.updated { margin-left: auto; font-size: 12.5px; background: rgba(255,255,255,.12);
  padding: 6px 12px; border-radius: 999px; display: flex; gap: 10px; flex-wrap: wrap; }
.updated b { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #5fd39a; display: inline-block; margin-right: 6px; }

nav.tabs { background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; position: sticky; top: 0; z-index: 5; }
nav.tabs button { background: none; border: 0; padding: 13px 14px; cursor: pointer; color: var(--muted);
  font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button.on { color: var(--brand-2); border-bottom-color: var(--brand-2); }

main { max-width: 1400px; margin: 0 auto; padding: 22px 24px 60px; }
.notice { background: var(--accent); border: 1px solid var(--border); padding: 10px 14px;
  border-radius: var(--radius); margin-bottom: 16px; color: var(--muted); }

.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.two { grid-template-columns: 2fr 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px;
  text-transform: uppercase; letter-spacing: .5px; }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.kpi .l { color: var(--muted); font-size: 13px; }
.kpi .s { color: var(--faint); font-size: 12px; margin-top: 2px; }

.chart svg { width: 100%; height: 200px; display: block; }
.chart .bar { fill: var(--brand-2); }
.chart .bar:hover { fill: var(--brand); }
.chart text { fill: var(--faint); font-size: 10px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 160px) 1fr 40px; gap: 10px;
  align-items: center; margin: 7px 0; font-size: 13px; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { background: var(--surface-2); border-radius: 4px; height: 10px; overflow: hidden; }
.fill { background: var(--brand-2); height: 100%; border-radius: 4px; }
.hbar .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

.drive { padding: 10px 0; border-bottom: 1px solid var(--border); }
.drive:last-child { border-bottom: 0; }
.drive .row1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.drive .row1 b { font-weight: 600; }
.drive .meta { color: var(--faint); font-size: 12px; margin-top: 4px; }
.flag { padding: 8px 10px; border-left: 3px solid var(--bad); background: var(--bad-bg);
  border-radius: 4px; margin-bottom: 8px; font-size: 13px; }
.flag .meta { color: var(--muted); font-size: 12px; }
.empty { color: var(--faint); padding: 18px 0; text-align: center; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input[type=search] { flex: 1 1 260px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 11px; outline: none; }
input:focus, textarea:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--accent); }
label.inl { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--brand-2); }
.btn.primary { background: var(--brand-2); border-color: var(--brand-2); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }

.tablewrap { overflow: auto; max-height: calc(100vh - 260px); border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 600;
  color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; max-width: 420px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent); }
.pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px;
  color: var(--muted); font-size: 13px; gap: 10px; flex-wrap: wrap; }
.pager .btns { display: flex; gap: 6px; }

.drawer-bg { position: fixed; inset: 0; background: rgba(10,18,30,.45); display: none; z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface);
  z-index: 21; transform: translateX(100%); transition: transform .2s; overflow-y: auto;
  box-shadow: -8px 0 24px rgba(0,0,0,.15); }
.drawer.open { transform: none; }
.drawer-bg.open { display: block; }
.drawer header { display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.drawer header h3 { margin: 0; font-size: 15px; }
.drawer dl { margin: 0; padding: 8px 20px 24px; }
.drawer dt { color: var(--faint); font-size: 12px; margin-top: 12px; }
.drawer dd { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
.x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.ph { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
.ph img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--surface-2); }
.ph .cap { padding: 8px 10px; font-size: 12.5px; }
.ph .cap b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ph .cap span { color: var(--faint); }
.lightbox { position: fixed; inset: 0; background: rgba(5,10,18,.92); z-index: 30; display: none;
  align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 82vh; border-radius: 6px; }
.lightbox .info { color: #dfe7f1; margin-top: 12px; text-align: center; max-width: 800px; font-size: 13px; }
.lightbox .x { position: absolute; top: 14px; right: 20px; color: #fff; font-size: 30px; }

.ask { max-width: 900px; margin: 0 auto; }
.scope { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.scope button { border: 0; background: var(--surface); padding: 7px 14px; cursor: pointer; }
.scope button.on { background: var(--brand-2); color: #fff; }
.askbox { display: flex; gap: 10px; margin-top: 12px; }
.askbox textarea { flex: 1; resize: vertical; min-height: 48px; max-height: 200px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--brand-2); border-color: var(--brand-2); }
.thread { margin-top: 22px; display: flex; flex-direction: column; gap: 14px; }
.msg { padding: 12px 16px; border-radius: var(--radius); max-width: 92%; }
.msg.q { align-self: flex-end; background: var(--brand-2); color: #fff; }
.msg.a { align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
  box-shadow: var(--shadow); white-space: pre-wrap; }
.msg.a.err { border-color: var(--bad); }
.msg .tag { font-size: 11px; opacity: .7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
.msg h4 { margin: 12px 0 8px; font-size: 13px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
  border-top-color: var(--brand-2); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.userbox { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.userbox button { background: rgba(255,255,255,.12); border: 0; color: #fff; padding: 6px 11px;
  border-radius: 6px; cursor: pointer; }
.userbox button:hover { background: rgba(255,255,255,.22); }

.auth { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.auth .card { width: min(400px, 100%); padding: 28px; }
.auth h2 { text-transform: none; letter-spacing: 0; font-size: 20px; color: var(--text); margin-bottom: 6px; }
.auth p { color: var(--muted); margin: 0 0 18px; }
.auth label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
.auth input { width: 100%; }
.auth .btn { width: 100%; margin-top: 18px; padding: 10px; }
.formerr { color: var(--bad); font-size: 13px; margin-top: 12px; min-height: 1em; }

.adduser { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.adduser input[type=email] { flex: 1 1 240px; }
.adduser input[type=text] { flex: 1 1 180px; }
.secret { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--good); border-radius: var(--radius);
  background: var(--accent); }
.secret code { font: 600 18px/1.4 ui-monospace, Consolas, monospace; letter-spacing: 1px; user-select: all; }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
.badge.admin { color: var(--brand-2); border-color: var(--brand-2); }
.badge.off { color: var(--bad); border-color: var(--bad); }
td .act { display: flex; gap: 6px; flex-wrap: wrap; }
td .act .btn { padding: 4px 10px; font-size: 12.5px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.users tbody tr { cursor: default; }

.result { margin-top: 14px; white-space: normal; }
.result-head { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  margin-bottom: 8px; flex-wrap: wrap; }
.result tbody tr { cursor: default; }
details.sql { margin-top: 10px; font-size: 12.5px; color: var(--muted); white-space: normal; }
details.sql summary { cursor: pointer; }
details.sql pre { white-space: pre-wrap; word-break: break-word; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--text); }

.console { max-width: 900px; margin: 0 auto; }
.console .log { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.console .msg.q { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.filecard { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filecard .fname { font-weight: 600; }
.mail { width: 100%; max-width: 100%; }
.mail iframe { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 8px; background: #fff; margin-top: 8px; }

a.btn { text-decoration: none; display: inline-block; }
.gate { max-width: 520px; margin: 40px auto; text-align: center; padding: 28px; }
.gate p { color: var(--muted); margin: 6px 0 18px; }
.upload { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.upload input[type=text] { flex: 1 1 220px; }
.upload input[type=file] { flex: 1 1 240px; max-width: 100%; }
.docs td .act { display: flex; gap: 6px; flex-wrap: wrap; }
.kind { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px;
  background: var(--accent); color: var(--brand-2); text-transform: uppercase; }
.kind.pdf { background: var(--bad-bg); color: var(--bad); }
.kind.word { background: var(--accent); color: var(--brand); }

@media (max-width: 640px) {
  header.top, main { padding-left: 16px; padding-right: 16px; }
  .updated { margin-left: 0; }
  .hbar { grid-template-columns: 90px 1fr 34px; }
}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Site Record</h1>
    <div class="sub">Site logs, D-wall panels and tunnel progress from the WhatsApp groups</div>
  </div>
  <div class="updated" id="updated" hidden></div>
  <div class="userbox" id="userbox" hidden></div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h3 id="drawerTitle">Entry</h3><button class="x" id="drawerClose" aria-label="Close">×</button></header>
  <dl id="drawerBody"></dl>
</aside>

<div class="lightbox" id="lightbox">
  <button class="x" id="lbClose" aria-label="Close">×</button>
  <img id="lbImg" alt="">
  <div class="info" id="lbInfo"></div>
</div>

<script>
"use strict";

// ── Helpers ──────────────────────────────────────────────────────────────────

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const fmtN = n => n == null ? "—" : Number(n).toLocaleString("en-SG");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Everything is shown in site time (Singapore), whatever the viewer's clock.
function sgParts(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const s = new Date(d.getTime() + 8 * 3600e3);
  return {y: s.getUTCFullYear(), m: s.getUTCMonth(), d: s.getUTCDate(),
          h: s.getUTCHours(), min: s.getUTCMinutes()};
}
function fmtDate(v) {
  if (!v) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  if (m) return `${+m[3]} ${MONTHS[+m[2] - 1]} ${m[1]}`;
  return fmtDateTime(v);
}
function fmtTime(p) {
  const h12 = p.h % 12 || 12;
  return `${h12}:${String(p.min).padStart(2, "0")}${p.h < 12 ? "am" : "pm"}`;
}
function fmtDateTime(v) {
  const p = sgParts(v);
  if (!p) return String(v);
  return `${p.d} ${MONTHS[p.m]} ${p.y}, ${fmtTime(p)}`;
}
const label = c => ({
  log_date: "Date", logged_at: "Logged", main_location: "Location", sub_location: "Sub-location",
  sender_name: "Sent by", sent_at: "Sent", sent_date: "Date", report_date: "Report date",
  pct_complete: "% complete", rings_built: "Rings built", current_ring: "Current ring",
  total_rings: "Total rings", tbm_location: "TBM location", flag_text: "Flagged item",
  overbreak_pct: "Overbreak %", created_at: "Recorded",
}[c] || c.replace(/_/g, " ").replace(/^./, s => s.toUpperCase()));

const NUMERIC = new Set(["rings_built", "current_ring", "total_rings", "pct_complete"]);
const TIMESTAMP = new Set(["logged_at", "sent_at", "created_at"]);
const DATE = new Set(["log_date", "sent_date"]);

function cellText(col, v) {
  if (v == null || v === "") return "";
  if (TIMESTAMP.has(col)) return fmtDateTime(v);
  if (DATE.has(col) || (col === "report_date" && /^\d{4}-/.test(v))) return fmtDate(v);
  if (col === "pct_complete") return `${Number(v).toLocaleString("en-SG", {maximumFractionDigits: 1})}%`;
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

// The record is public; a 401 only comes from what needs a login. For someone
// who was logged in it means the session ended (logged out elsewhere, removed
// by an admin, expired): offer the login form rather than show an error.
async function api(path, opts) {
  const r = await fetch(path, {credentials: "same-origin", ...opts});
  if (!r.ok) {
    let detail = `${r.status} ${r.statusText}`;
    try { detail = (await r.json()).detail || detail; } catch {}
    if (r.status === 401 && ME && path !== "/api/login" && path !== "/api/me") {
      ME = null; showLogin("Your session has ended. Please log in again.");
    }
    throw new Error(detail);
  }
  return r.json();
}
const post = (path, body) => api(path, {method: "POST",
  headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// The answers are written for WhatsApp: *bold* and "•" bullets.
function renderWhatsApp(text) {
  return esc(text).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>");
}

// ── State and routing ────────────────────────────────────────────────────────

let META = null;
let ME = null;
const VIEWS = [
  ["overview", "Overview"],
  ["daily_logs", "Site logs"],
  ["dwall_panels", "D-wall panels"],
  ["tunnel_progress", "Tunnel progress"],
  ["tunnel_flags", "Flagged items"],
  ["photos", "Photos"],
  ["documents", "Documents"],
  ["ask", "Ask"],
  ["console", "Console"],
];
const tableState = {};
let current = null;

function renderTabs() {
  $("#tabs").innerHTML = VIEWS.map(([k, t]) =>
    `<button data-v="${k}" class="${k === current ? "on" : ""}">${t}</button>`).join("");
}
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  // From the login form the hash may already be this tab's.
  if (location.hash.slice(1) === b.dataset.v) route(); else location.hash = b.dataset.v;
});
window.addEventListener("hashchange", route);

function route() {
  if (!META) return;                    // not logged in yet
  const v = location.hash.slice(1) || "overview";
  current = VIEWS.some(([k]) => k === v) ? v : "overview";
  renderTabs();
  show(current);
}

function show(v) {
  if (v === "overview") return showOverview();
  if (v === "photos") return showPhotos();
  if (v === "documents") return showDocuments();
  if (v === "ask") return showAsk();
  if (v === "users") return showUsers();
  if (v === "console") return showConsole();
  return showTable(v);
}

// ── Last / next update ───────────────────────────────────────────────────────

let refreshTimer = null;
function renderUpdated(u) {
  $("#updated").hidden = false;
  const last = sgParts(u.last), next = sgParts(u.next);
  const day = p => `${p.d} ${MONTHS[p.m]}`;
  $("#updated").innerHTML =
    `<span><span class="dot"></span>Updated <b>${day(last)}, ${fmtTime(last)}</b></span>` +
    `<span>Next update <b>${fmtTime(next)}</b></span>` +
    (u.waiting ? `<span>${fmtN(u.waiting)} post${u.waiting === 1 ? "" : "s"} waiting</span>` : "");

  // The record only moves at the bot's batch slots, so reload just after the
  // next one rather than polling. Two minutes' grace lets the batch finish.
  clearTimeout(refreshTimer);
  const wait = Math.max(60e3, new Date(u.next) - Date.now() + 120e3);
  refreshTimer = setTimeout(() => { loadUpdated(); if (!["ask", "console", "login"].includes(current)) show(current); }, wait);
}
async function loadUpdated() {
  try { renderUpdated((await api("/api/overview")).updated); } catch {}
}

// ── Overview ─────────────────────────────────────────────────────────────────

function notices() {
  const out = [];
  if (!META.site_configured) out.push("Site data is not connected yet (DASHBOARD_SITE_GROUP_ID is not set).");
  if (!META.tunnel_configured) out.push("Tunnel data is not connected yet (TUNNEL_GROUP_IDS is not set).");
  return out.map(t => `<div class="notice">${esc(t)}</div>`).join("");
}

function barChart(rows) {
  if (!rows.length) return `<div class="empty">No entries in the last 30 days.</div>`;
  // Fill missing days with zero so the axis is real calendar time.
  const byDay = Object.fromEntries(rows.map(r => [r.day, r.entries]));
  const days = [];
  const end = new Date(rows[rows.length - 1].day + "T00:00:00Z");
  for (let i = 29; i >= 0; i--) {
    const d = new Date(end.getTime() - i * 864e5).toISOString().slice(0, 10);
    days.push([d, byDay[d] || 0]);
  }
  const max = Math.max(...days.map(d => d[1]), 1);
  const W = 900, H = 200, pad = 22, bw = (W - pad) / days.length;
  const bars = days.map(([d, n], i) => {
    const h = (n / max) * (H - pad - 8);
    const x = pad + i * bw + 2, y = H - pad - h;
    const lbl = i % 5 === 0 || i === days.length - 1
      ? `<text x="${x + bw / 2 - 2}" y="${H - 6}" text-anchor="middle">${+d.slice(8)} ${MONTHS[+d.slice(5, 7) - 1]}</text>` : "";
    return `<rect class="bar" x="${x}" y="${y}" width="${bw - 4}" height="${Math.max(h, n ? 2 : 0)}" rx="2"><title>${fmtDate(d)}: ${n} entries</title></rect>${lbl}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Site entries per day">
    <text x="0" y="12">${max}</text>${bars}</svg>`;
}

function hbars(rows, key, val) {
  if (!rows.length) return `<div class="empty">Nothing yet.</div>`;
  const max = Math.max(...rows.map(r => r[val]), 1);
  return rows.map(r => `<div class="hbar"><span class="name" title="${esc(r[key])}">${esc(r[key])}</span>
    <div class="track"><div class="fill" style="width:${(r[val] / max) * 100}%"></div></div>
    <span class="n">${fmtN(r[val])}</span></div>`).join("");
}

function query(st, extra = {}) {
  const p = new URLSearchParams();
  if (st.q) p.set("q", st.q);
  if (st.from) p.set("from", st.from);
  if (st.to) p.set("to", st.to);
  for (const [k, v] of Object.entries(extra)) p.set(k, v);
  return p.toString();
}

const EXAMPLES = {
  site: ["What was done yesterday?", "Which locations had casting this week?",
         "How many entries were logged at U3 last month?", "Show me photos of Zone 3 from last week"],
  tunnel: ["How far along is each drive?", "Any instrumentation breaching AL this week?",
           "Rings built per contract yesterday", "What items were flagged today?"],
};
const askState = {scope: "site", thread: []};

// Every row the answer's query returned, under the answer — the web has no
// row cap, so this is the whole result, and the place to check the answer
// against. Long results draw the first rows and the rest on request, so the
// page stays quick; the CSV always holds all of them.
const RESULT_PREVIEW_ROWS = 500;

function resultCell(col, v) {
  if (v == null) return "";
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}T/.test(v)) return fmtDateTime(v);
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtDate(v);
  return cellText(col, v);
}

function resultBlock(m, i) {
  if (!m.rows || !m.rows.length) {
    return m.sql ? `<details class="sql"><summary>Query run — no rows</summary><pre>${esc(m.sql)}</pre></details>` : "";
  }
  const cols = Object.keys(m.rows[0]);
  const shown = m.showAll ? m.rows : m.rows.slice(0, RESULT_PREVIEW_ROWS);
  return `<div class="result">
    <div class="result-head"><b>All ${fmtN(m.rows.length)} matching entr${m.rows.length === 1 ? "y" : "ies"}</b>
      <button class="btn" data-csv="${i}">Download CSV</button></div>
    <div class="tablewrap" style="max-height:480px"><table><thead><tr>${cols.map(c => `<th>${esc(label(c))}</th>`).join("")}</tr></thead>
      <tbody>${shown.map(r => `<tr>${cols.map(c => `<td class="${NUMERIC.has(c) || typeof r[c] === "number" ? "num" : ""}">${esc(resultCell(c, r[c]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    ${shown.length < m.rows.length ? `<button class="btn" data-all="${i}" style="margin-top:8px">Show all ${fmtN(m.rows.length)} rows</button>` : ""}
    <details class="sql"><summary>Query run</summary><pre>${esc(m.sql)}</pre></details></div>`;
}

function downloadCsv(m) {
  const cols = Object.keys(m.rows[0]);
  const q = v => {
    const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [cols.map(label).map(q).join(",")]
    .concat(m.rows.map(r => cols.map(c => q(resultCell(c, r[c]))).join(","))).join("\r\n");
  // The BOM makes Excel read the file as UTF-8, so "›" and names survive.
  const url = URL.createObjectURL(new Blob(["﻿" + csv], {type: "text/csv"}));
  const a = Object.assign(document.createElement("a"), {href: url, download: "answer_rows.csv"});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10e3);
}

function renderThread() {
  const t = $("#thread");
  if (!t) return;
  t.innerHTML = askState.thread.map((m, i) => {
    if (m.role === "q") return `<div class="msg q"><div class="tag">${m.scope === "tunnel" ? "Tunnel" : "Site"}</div>${esc(m.text)}</div>`;
    if (m.pending) return `<div class="msg a"><span class="spinner"></span>Searching the record…</div>`;
    if (m.error) return `<div class="msg a err">${esc(m.error)}</div>`;
    if (m.kind === "photos") {
      const total = m.sections.reduce((n, s) => n + s.photos.length, 0);
      if (!total) return `<div class="msg a">I couldn't find any photos for that.</div>`;
      return `<div class="msg a" style="white-space:normal;max-width:100%">
        <b>${total} photo${total === 1 ? "" : "s"}</b>${m.period ? " · " + esc(m.period) : ""}
        ${m.sections.map(s => `<h4>${esc(s.title)} (${s.photos.length})</h4>
          <div class="photos">${s.photos.map(photoCard).join("") || '<div class="empty">None found.</div>'}</div>`).join("")}
        ${m.capped ? `<p class="s">Some photos were left out — narrow the dates to see the rest.</p>` : ""}</div>`;
    }
    const rows = resultBlock(m, i);
    return `<div class="msg a"${rows ? ' style="max-width:100%;width:100%"' : ""}>${renderWhatsApp(m.answer)}${rows}</div>`;
  }).join("");
}

  $("#view").innerHTML = `${notices()}<div class="ask">

      </div>

async function send() {
  const q = $("#question").value.trim();
  if (q.length < 2) return;
  $("#question").value = "";
  $("#send").disabled = true;
  const scope = askState.scope;
  const answer = {role: "a", pending: true};
  askState.thread.unshift(answer);
  askState.thread.unshift({role: "q", text: q, scope});
  renderThread();
  try {
    Object.assign(answer, await api("/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, scope}),
    }));
  } catch (e) {
    answer.error = e.message;
  }
  answer.pending = false;
  if ($("#send")) $("#send").disabled = false;
  renderThread();
}

    <div class="log" id="clog"></div></div>`;

  const setScope = s => {
    consoleState.scope = s;
    for (const b of $("#cscope").children) b.classList.toggle("on", b.dataset.s === s);
    $("#cchips").innerHTML = CONSOLE_CHIPS[s].map(x => `<button class="chip">${esc(x)}</button>`).join("");
  };
  $("#cscope").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setScope(b.dataset.s); });
  $("#cchips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) { $("#ctext").value = c.textContent; $("#ctext").focus(); } });
  $("#crun").addEventListener("click", runConsole);
  $("#ctext").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); runConsole(); } });
  $("#clog").addEventListener("click", e => {
    const b = e.target.closest("button[data-dl]");
    if (b) downloadFile(consoleState.log[+b.dataset.dl]);
  });
  setScope(consoleState.scope);
  renderConsoleLog();
}

async function runConsole() {
  const text = $("#ctext").value.trim();
  if (!text) return;
  $("#ctext").value = "";
  $("#crun").disabled = true;
  const scope = consoleState.scope;
  consoleState.log.push({role: "q", text, scope});
  const pending = {role: "a", pending: true};
  consoleState.log.push(pending);
  renderConsoleLog();
  let replies;
  try { replies = (await post("/api/console", {text, scope})).replies; }
  catch (e) { replies = [{error: e.message}]; }
  consoleState.log.splice(consoleState.log.indexOf(pending), 1,
                          ...replies.map(r => ({role: "a", ...r})));
  if ($("#crun")) $("#crun").disabled = false;
  renderConsoleLog();
}

// ── Documents ────────────────────────────────────────────────────────────────

const docsState = {q: ""};
const fmtSize = b => b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;

function showDocuments() {
  $("#view").innerHTML = `<div class="card">
      <b>Documents</b>
      <div style="color:var(--muted);font-size:13px">PDF, Excel, Word and text files shared with the site record. Anyone with this page can open them.</div>
      ${ME ? `<form class="upload" id="upForm">
          <input type="file" id="upFile" accept=".pdf,.xlsx,.xlsm,.xls,.docx,.doc,.txt" required>
          <input type="text" id="upNote" maxlength="300" placeholder="Note (optional), e.g. Rev B drawings for U3">
          <button class="btn primary" id="upBtn">Upload</button></form>
        <div class="formerr" id="upErr"></div>
        <div id="wog" hidden style="margin-top:10px;font-size:13px;color:var(--muted)">On a WOG laptop, where this upload is blocked?
          <a class="btn" id="wogLink" target="_blank" rel="noopener" style="margin-left:6px">Upload through FormSG ↗</a>
          <span style="display:block;margin-top:4px">Files sent there appear here within a minute.</span></div>`
      : `<div style="margin-top:10px;font-size:13px;color:var(--muted)">To upload a file, <a href="#" id="upLogin">log in</a>.</div>`}
    </div>
    <div class="toolbar" style="margin-top:16px">
      <input type="search" id="q" placeholder="Search by name, note or uploader…" value="${esc(docsState.q)}"></div>
    <div class="tablewrap docs"><table><thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Note</th>
      <th>Uploaded by</th><th>Uploaded</th><th></th></tr></thead>
      <tbody id="docRows"><tr><td colspan="7" class="empty"><span class="spinner"></span>Loading…</td></tr></tbody></table></div>
    <div class="formerr" id="docErr"></div>`;

  let maxMb = 25;
  const load = async () => {
    try {
      const r = await api(`/api/documents?${new URLSearchParams(docsState.q ? {q: docsState.q} : {})}`);
      if (current !== "documents") return;
      maxMb = r.max_mb;
      if (r.form_url && $("#wog")) { $("#wogLink").href = r.form_url; $("#wog").hidden = false; }
      $("#docRows").innerHTML = r.documents.length ? r.documents.map(d => {
        const href = `/api/documents/${d.id}`;
        return `<tr><td><a href="${href}" target="_blank" rel="noopener">${esc(d.filename)}</a></td>
          <td><span class="kind ${d.kind === "pdf" ? "pdf" : /^doc/.test(d.kind) ? "word" : ""}">${esc(d.kind)}</span></td>
          <td class="nowrap num">${fmtSize(d.size_bytes)}</td>
          <td>${esc(d.note || "")}</td><td>${esc(d.uploaded_by || "")}</td>
          <td class="nowrap">${fmtDateTime(d.uploaded_at)}</td>
          <td><div class="act"><a class="btn" href="${href}?download=1">Download</a>
            ${d.can_delete ? `<button class="btn danger" data-del="${d.id}">Remove</button>` : ""}</div></td></tr>`;
      }).join("") : `<tr><td colspan="7" class="empty">${docsState.q ? "No documents match." : "No documents yet."}</td></tr>`;
    } catch (e) {
      $("#docRows").innerHTML = `<tr><td colspan="7" class="empty">Couldn't load: ${esc(e.message)}</td></tr>`;
    }
  };

  $("#q").addEventListener("input", debounce(e => { docsState.q = e.target.value.trim(); load(); }, 300));
  $("#upLogin")?.addEventListener("click", e => { e.preventDefault(); showLogin(); });
  $("#upForm")?.addEventListener("submit", async e => {
    e.preventDefault();
    const file = $("#upFile").files[0];
    $("#upErr").textContent = "";
    if (!file) return;
    if (!/\.(pdf|xlsx|xlsm|xls|docx|doc|txt)$/i.test(file.name)) { $("#upErr").textContent = "Only PDF, Excel, Word and text files can be uploaded."; return; }
    if (file.size > maxMb * 1048576) { $("#upErr").textContent = `That file is over ${maxMb} MB.`; return; }
    const btn = $("#upBtn");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>Uploading…`;
    try {
      const params = new URLSearchParams({filename: file.name, note: $("#upNote").value.trim()});
      await api(`/api/documents?${params}`, {method: "POST",
        headers: {"Content-Type": "application/octet-stream"}, body: file});
      $("#upForm").reset();
      load();
    } catch (err) { if ($("#upErr")) $("#upErr").textContent = err.message; }
    btn.disabled = false; btn.textContent = "Upload";
  });
  $("#docRows").addEventListener("click", async e => {
    const b = e.target.closest("button[data-del]");
    if (!b) return;
    // Two clicks rather than a browser dialog.
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "Confirm remove";
      setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remove"; }, 4000);
      return;
    }
    $("#docErr").textContent = "";
    try { await api(`/api/documents/${b.dataset.del}`, {method: "DELETE"}); load(); }
    catch (err) { $("#docErr").textContent = err.message; }
  });
  load();
}

// ── Users (admins only) ──────────────────────────────────────────────────────

function secretBox(email, password, what) {
  return `<div class="secret">${what} for <b>${esc(email)}</b>. Give them this one-time password —
    it is shown only now. They will choose their own when they first log in.<br>
    <code>${esc(password)}</code> <button class="btn" id="copy" style="margin-left:8px">Copy</button></div>`;
}

async function showUsers() {
  $("#view").innerHTML = `<div class="card">
      <h2>Add someone</h2>
      <form class="adduser" id="addForm">
        <input type="email" id="newEmail" placeholder="name@lta.gov.sg" required>
        <input type="text" id="newName" placeholder="Name (optional)">
        <label class="inl"><input type="checkbox" id="newAdmin"> Admin</label>
        <button class="btn primary">Add</button>
      </form>
      <div class="formerr" id="addErr"></div>
      <div id="secret"></div>
    </div>
    <div class="tablewrap users" style="margin-top:16px"><table><thead><tr>
      <th>Email</th><th>Name</th><th>Status</th><th>Last login</th><th>Added</th><th></th></tr></thead>
      <tbody id="userRows"><tr><td colspan="6" class="empty"><span class="spinner"></span>Loading…</td></tr></tbody></table></div>`;

  const showSecret = (email, password, what) => {
    $("#secret").innerHTML = secretBox(email, password, what);
    $("#copy").addEventListener("click", () => navigator.clipboard?.writeText(password));
  };

  const load = async () => {
    const {users} = await api("/api/admin/users");
    $("#userRows").innerHTML = users.map(u => {
      const self = u.id === ME.id;
      const badges = [u.is_admin && `<span class="badge admin">Admin</span>`,
        u.disabled && `<span class="badge off">Disabled</span>`,
        u.must_change_password && !u.disabled && `<span class="badge">Not logged in yet</span>`]
        .filter(Boolean).join("") || `<span class="badge">Active</span>`;
      const actions = self ? `<span class="s" style="color:var(--faint)">You</span>` : `<div class="act">
        <button class="btn" data-a="reset" data-id="${u.id}" data-email="${esc(u.email)}">Reset password</button>
        <button class="btn" data-a="${u.disabled ? "enable" : "disable"}" data-id="${u.id}">${u.disabled ? "Enable" : "Disable"}</button>
        <button class="btn danger" data-a="delete" data-id="${u.id}">Remove</button></div>`;
      return `<tr><td>${esc(u.email)}</td><td>${esc(u.name || "")}</td><td>${badges}</td>
        <td class="nowrap">${u.last_login_at ? fmtDateTime(u.last_login_at) : "—"}</td>
        <td class="nowrap">${fmtDate(u.created_at?.slice(0, 10))}${u.created_by ? `<br><span style="color:var(--faint)">${esc(u.created_by)}</span>` : ""}</td>
        <td>${actions}</td></tr>`;
    }).join("");
  };

  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("#addErr").textContent = "";
    try {
      const r = await post("/api/admin/users", {email: $("#newEmail").value.trim(),
        name: $("#newName").value.trim(), is_admin: $("#newAdmin").checked});
      showSecret(r.user.email, r.temporary_password, "Account created");
      $("#addForm").reset();
      load();
    } catch (err) { $("#addErr").textContent = err.message; }
  });

  $("#userRows").addEventListener("click", async e => {
    const b = e.target.closest("button[data-a]");
    if (!b) return;
    const id = b.dataset.id;
    try {
      if (b.dataset.a === "delete") {
        // Two clicks rather than a browser dialog.
        if (!b.classList.contains("armed")) {
          b.classList.add("armed"); b.textContent = "Confirm remove";
          setTimeout(() => { b.classList.remove("armed"); b.textContent = "Remove"; }, 4000);
          return;
        }
        await api(`/api/admin/users/${id}`, {method: "DELETE"});
      } else if (b.dataset.a === "reset") {
        const r = await post(`/api/admin/users/${id}/reset`);
        showSecret(b.dataset.email, r.temporary_password, "Password reset");
      } else {
        await post(`/api/admin/users/${id}/disabled`, {disabled: b.dataset.a === "disable"});
      }
      load();
    } catch (err) { $("#addErr").textContent = err.message; }
  });

  try { await load(); }
  catch (e) { $("#userRows").innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`; }
}

// ── Login ────────────────────────────────────────────────────────────────────

// Only while a one-time password must be replaced: nothing else is reachable.
function hideChrome() {
  clearTimeout(refreshTimer);
  $("#tabs").hidden = true;
  $("#updated").hidden = true;
  $("#userbox").hidden = true;
}

function showLogin(message = "") {
  current = "login";
  if (META) renderTabs();
  $("#view").innerHTML = `<div class="auth"><form class="card" id="loginForm">
      <h2>Log in</h2><p>Anyone can browse the record. Logging in lets you ask questions, use the console
        and upload documents. Accounts are by invitation — ask the dashboard's admin.</p>
      <label for="email">Email</label><input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required>
      <button class="btn primary">Log in</button>
      ${META ? `<button type="button" class="btn" id="loginBack" style="margin-top:8px">Back to the record</button>` : ""}
      <div class="formerr" id="loginErr">${esc(message)}</div></form></div>`;
  $("#email").focus();
  $("#loginBack")?.addEventListener("click", route);
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("#loginErr").textContent = "";
    try {
      const {user} = await post("/api/login", {email: $("#email").value.trim(), password: $("#password").value});
      start(user);
    } catch (err) { $("#loginErr").textContent = err.message; }
  });
}

function showChangePassword(forced) {
  if (forced) hideChrome();
  $("#view").innerHTML = `<div class="auth"><form class="card" id="pwForm">
      <h2>${forced ? "Choose your password" : "Change password"}</h2>
      <p>${forced ? "You logged in with a one-time password. Choose your own to continue." : "At least 10 characters."}</p>
      <label for="cur">${forced ? "One-time password" : "Current password"}</label>
      <input type="password" id="cur" autocomplete="current-password" required>
      <label for="pw1">New password</label><input type="password" id="pw1" autocomplete="new-password" minlength="10" required>
      <label for="pw2">New password again</label><input type="password" id="pw2" autocomplete="new-password" minlength="10" required>
      <button class="btn primary">Save password</button>
      ${forced ? "" : `<button type="button" class="btn" id="pwCancel" style="margin-top:8px">Cancel</button>`}
      <div class="formerr" id="pwErr"></div></form></div>`;
  $("#cur").focus();
  $("#pwCancel")?.addEventListener("click", () => show(current));
  $("#pwForm").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("#pw1").value !== $("#pw2").value) { $("#pwErr").textContent = "The new passwords don't match."; return; }
    try {
      await post("/api/me/password", {current: $("#cur").value, new: $("#pw1").value});
      const {user} = await api("/api/me");
      start(user);
    } catch (err) { $("#pwErr").textContent = err.message; }
  });
}

function renderUserbox() {
  $("#userbox").hidden = false;
  if (!ME) {
    $("#userbox").innerHTML = `<button id="login">Log in</button>`;
    $("#login").addEventListener("click", () => showLogin());
    return;
  }
  $("#userbox").innerHTML = `<span>${esc(ME.name || ME.email)}</span>
    <button id="chpw">Change password</button><button id="logout">Log out</button>`;
  $("#chpw").addEventListener("click", () => showChangePassword(false));
  $("#logout").addEventListener("click", async () => {
    try { await post("/api/logout"); } catch {}
    start(null);
  });
}

// ── Start ────────────────────────────────────────────────────────────────────

// `user` is null for a visitor: the record is public, the rest asks for a login.
async function start(user) {
  ME = user || null;
  if (ME && ME.must_change_password) return showChangePassword(true);
  const users = VIEWS.findIndex(([k]) => k === "users");
  if (ME?.is_admin) { if (users < 0) VIEWS.push(["users", "Users"]); }
  else if (users >= 0) VIEWS.splice(users, 1);
  if (!META) {
    try { META = await api("/api/meta"); }
    catch (e) { $("#view").innerHTML = `<div class="notice">Couldn't reach the server: ${esc(e.message)}</div>`; return; }
  }
  $("#tabs").hidden = false;
  renderUserbox();
  route();
  if (current !== "overview") loadUpdated();
}

(async () => {
  let me = null;
  try { me = (await api("/api/me")).user; } catch {}   // 401: a visitor
  start(me);
})();
</script>
